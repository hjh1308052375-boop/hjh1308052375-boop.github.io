<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
<title id="title">Conceptual downhole fiber deployments / 井下光纤布设概念</title><desc id="desc">Two illustrative alternatives: fiber cemented in the annulus outside the casing, and fiber attached to tubing inside the casing, potentially retrievable with the tubing depending on the design. A radial cross-section of the casing-exterior option shows fluid, steel casing, cement, formation, and the sensor location. Heat travels through several materials to the sensor, so recorded temperature is influenced by thermal transport and installation. Geometry is not to scale. 两种示意方案：套管外环空中固结的光纤，以及套管内附着于油管、可回收性取决于设计的光纤。径向剖面显示流体、钢套管、水泥、地层及传感位置；温度受多层介质传热与布设方式影响。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#125e83"/></marker><marker id="warm-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e4ac6c"/></marker></defs>
<rect width="820" height="500" fill="#f8fafc"/>
<g font-family="Inter, Segoe UI, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="28" y="35" font-size="25" fill="#122d40" font-weight="600" text-anchor="start" >Where the fiber sits matters</text><text x="28" y="64" font-size="20" fill="#125e83" font-weight="400" text-anchor="start" >光纤位置影响它能观测到什么</text><text x="792" y="32" font-size="13" fill="#566b79" font-weight="600" text-anchor="end" >CONCEPTUAL</text><text x="792" y="54" font-size="16" fill="#566b79" font-weight="400" text-anchor="end" >概念示意</text><rect x="28" y="91" width="238" height="310" rx="8" fill="white" stroke="#d9e2e8"/><rect x="284" y="91" width="238" height="310" rx="8" fill="white" stroke="#d9e2e8"/><rect x="540" y="91" width="252" height="310" rx="8" fill="white" stroke="#d9e2e8"/><text x="44" y="120" font-size="20" fill="#122d40" font-weight="600" text-anchor="start" >A · Casing exterior</text><text x="44" y="148" font-size="18" fill="#125e83" font-weight="400" text-anchor="start" >套管外侧 · 水泥固结</text><text x="300" y="120" font-size="20" fill="#122d40" font-weight="600" text-anchor="start" >B · Tubing attached</text><text x="300" y="148" font-size="18" fill="#125e83" font-weight="400" text-anchor="start" >油管附着 · 设计可回收</text><text x="556" y="120" font-size="20" fill="#122d40" font-weight="600" text-anchor="start" >Radial section</text><text x="556" y="148" font-size="18" fill="#125e83" font-weight="400" text-anchor="start" >径向剖面：方案 A</text><rect x="77" y="174" width="142" height="148" rx="0" fill="#e8edf0" stroke="none"/><rect x="96" y="174" width="104" height="148" rx="0" fill="#f4d9b8" stroke="none"/><rect x="112" y="174" width="72" height="148" rx="0" fill="#122d40" stroke="none"/><rect x="122" y="174" width="52" height="148" rx="0" fill="#d9eef4" stroke="none"/><line x1="188" y1="169" x2="188" y2="328" stroke="#68d4e0" stroke-width="5" /><line x1="183" y1="189" x2="190" y2="189" stroke="#125e83" stroke-width="2" /><line x1="183" y1="232" x2="190" y2="232" stroke="#125e83" stroke-width="2" /><line x1="183" y1="275" x2="190" y2="275" stroke="#125e83" stroke-width="2" 