<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 554" role="img" aria-labelledby="title desc">
<title id="title">A qualitative DTS temperature trace during cementing / 固井期间 DTS 定性温度曲线</title><desc id="desc">An illustrative, unmeasured temperature trace at one fiber location changes through pumping, thermal recovery and hydration heat. Colored time bands overlap to show that these influences are not cleanly separable. There are no numeric time or temperature scales. Curve timing and shape vary with materials, pumping history, environment and installation; no temperature peak is mapped to setting time. Temperature alone does not establish cement strength, bond quality or hydraulic sealing. 单点位置的示意温度曲线反映泵注、温度恢复与水化放热等过程的叠加；无定量坐标，非实测数据。峰值与凝结时间没有通用对应关系，温度单独不能证明水泥强度、胶结质量或水力密封。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#125e83"/></marker><marker id="warm-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e4ac6c"/></marker></defs>
<rect width="820" height="554" fill="#f8fafc"/>
<g font-family="Inter, Segoe UI, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="28" y="35" font-size="25" fill="#122d40" font-weight="600" text-anchor="start" >Temperature combines several processes</text><text x="28" y="64" font-size="20" fill="#125e83" font-weight="400" text-anchor="start" >温度曲线是多个过程叠加的结果</text><text x="792" y="31" font-size="13" fill="#566b79" font-weight="600" text-anchor="end" >ILLUSTRATIVE ONLY</text><text x="792" y="54" font-size="16" fill="#566b79" font-weight="400" text-anchor="end" >非实测数据</text><text x="78" y="103" font-size="18" fill="#122d40" font-weight="500" text-anchor="start" >Temperature at one fiber location</text><text x="78" y="128" font-size="17" fill="#566b79" font-weight="400" text-anchor="start" >光纤某一位置的温度</text><line x1="79" y1="312" x2="79" y2="151" stroke="#125e83" stroke-width="2" marker-end="url(#arrow)"/><line x1="79" y1="312" x2="776" y2="312" stroke="#125e83" stroke-width="2" marker-end="url(#arrow)"/><path d="M91 196 C120 198 121 249 167 262 C210 275 242 251 285 229 C337 204 364 153 424 146 C478 138 501 167 551 190 C611 218 671 223 763 224" fill="none" stroke="#125e83" stroke-width="4"/><text x="763" y="291" font-size="17" fill="#566b79" font-weight="400" text-anchor="end" >Time → / 时间 →</text><text x="97" y="295" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >No numeric scales / 无定量刻度</text><rect x="99" y="337" width="252" height="31" rx="6" fill="#d8e8ee" stroke="none"/><text x="115" y="359" font-size="17" fill="#122d40" font-weight="500" text-anchor="start" >Pumping / 泵注</text><rect x="171" y="378" width="589" height="31" rx="6" fill="#caf0f2" stroke="none"/><text x="187" y="400" font-size="17" fill="#122d40" font-weight="500" text-anchor="start" >Thermal recovery / 温度恢复</text><rect x="241" y="419" width="453" height="31" rx="6" fill="#f3d8b7" stroke="none"/><text x="257" y="441" font-size="17" fill="#122d40" font-weight="500" text-anchor="start" >Hydration heat / 水化放热</text><text x="28" y="478" font-size="17" fill="#566b79" font-weight="400" text-anchor="start" >Overlapping influences; timing varies. / 多个过程可重叠，时序因工况而异。</text><text x="28" y="507" font-size="18" fill="#122d40" font-weight="600" text-anchor="start" >Temperature ≠ cement strength, bond quality or hydraulic seal.</text><text x="28" y="532" font-size="18" fill="#122d40" font-weight="500" text-anchor="start" >温度 ≠ 水泥强度、胶结质量或水力密封。</text></g></svg>
