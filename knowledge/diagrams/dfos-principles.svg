<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 496" role="img" aria-labelledby="title desc">
<title id="title">How distributed fiber sensing works / 分布式光纤传感原理</title><desc id="desc">Conceptual optical pulses travel along a fiber and return as backscatter. Return time indicates position. Common implementations extract Rayleigh phase for DAS dynamic axial strain or strain rate, Raman anti-Stokes to Stokes intensity ratio for DTS temperature, or Brillouin frequency shift for DSS strain and temperature sensitivity. DSS can also use other scattering mechanisms and techniques. Calibration, compensation, and mechanical coupling matter; this is not a single instrument measuring every quantity independently. 光脉冲沿光纤传播并产生后向散射，往返时间对应位置。常见实现利用瑞利相位、拉曼强度比或布里渊频移，分别测量动态轴向应变或应变率、温度或对应变与温度敏感的信号。DSS 也可采用其他散射机制与技术。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#125e83"/></marker><marker id="warm-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e4ac6c"/></marker></defs>
<rect width="820" height="496" fill="#f8fafc"/>
<g font-family="Inter, Segoe UI, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="28" y="35" font-size="25" fill="#122d40" font-weight="600" text-anchor="start">One fiber, different observables</text><text x="28" y="64" font-size="20" fill="#125e83" font-weight="400" text-anchor="start">同一类光纤，不同的观测量</text><text x="792" y="32" font-size="13" fill="#566b79" font-weight="600" text-anchor="end">CONCEPTUAL</text><text x="792" y="54" font-size="16" fill="#566b79" font-weight="400" text-anchor="end">概念示意</text><rect x="28" y="100" width="167" height="96" rx="8" fill="#122d40" stroke="none"/><text x="111" y="137" font-size="20" fill="white" font-weight="600" text-anchor="middle">Interrogator</text><text x="111" y="166" font-size="20" fill="#b9e7ee" font-weight="400" text-anchor="middle">解调仪</text><line x1="195" y1="148" x2="785" y2="148" stroke="#122d40" stroke-width="7"/><line x1="195" y1="148" x2="785" y2="148" stroke="#68d4e0" stroke-width="3"/><line x1="233" y1="105" x2="385" y2="105" stroke="#125e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="408" y="104" font-size="19" fill="#125e83" font-weight="400" text-anchor="start">Optical pulses</text><text x="408" y="128" font-size="17" fill="#125e83" font-weight="400" text-anchor="start">光脉冲</text><line x1="609" y1="189" x2="234" y2="189" stroke="#125e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="628" y="186" font-size="18" fill="#125e83" font-weight="400" text-anchor="start">Backscatter</text><text x="628" y="209" font-size="17" fill="#125e83" font-weight="400" text-anchor="start">后向散射</text><circle cx="267" cy="148" r="5" fill="#68d4e0" stroke="#122d40" stroke-width="1.5"/><circle cx="365" cy="148" r="5" fill="#68d4e0" stroke="#122d40" stroke-width="1.5"/><circle cx="463" cy="148" r="5" fill="#68d4e0" stroke="#122d40" stroke-width="1.5"/><circle cx="561" cy="148" r="5" fill="#68d4e0" stroke="#122d40" stroke-width="1.5"/><circle cx="659" cy="148" r="5" fill="#68d4e0" stroke="#122d40" stroke-width="1.5"/><circle cx="757" cy="148" r="5" fill="#68d4e0" stroke="#122d40" stroke-width="1.5"/><text x="28" y="225" font-size="17" fill="#566b79" font-weight="400" text-anchor="start">Return time → position</text><text x="288" y="225" font-size="17" fill="#566b79" font-weight="400" text-anchor="start">往返时间 → 位置</text><circle cx="570" cy="189" r="3" fill="#125e83" stroke="none" stroke-width="1"/><line x1="570" y1="189" x2="570" y2="237" stroke="#125e83" stroke-width="1.5"/><line x1="149" y1="237" x2="671" y2="237" stroke="#125e83" stroke-width="1.5"/><line x1="149" y1="237" x2="149" y2="245" stroke="#125e83" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="410" y1="237" x2="410" y2="245" stroke="#125e83" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="671" y1="237" x2="671" y2="245" stroke="#125e83" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="28" y="247" width="242" height="183" rx="8" fill="white" stroke="#d9e2e8"/><rect x="28" y="247" width="242" height="5" rx="2" fill="#125e83" stroke="none"/><text x="44" y="283" font-size="21" fill="#122d40" font-weight="600" text-anchor="start">DAS · Rayleigh</text><text x="44" y="308" font-size="17" fill="#566b79" font-weight="400" text-anchor="start">瑞利散射</text><text x="44" y="340" font-size="16" fill="#125e83" font-weight="500" text-anchor="start">Dynamic phase changes</text><text x="44" y="364" font-size="15" fill="#125e83" font-weight="400" text-anchor="start">动态相位变化</text><text x="44" y="397" font-size="18" fill="#122d40" font-weight="600" text-anchor="start">Axial strain / strain rate</text><text x="44" y="420" font-size="17" fill="#122d40" font-weight="400" text-anchor="start">轴向应变／应变率</text><rect x="289" y="247" width="242" height="183" rx="8" fill="white" stroke="#d9e2e8"/><rect x="289" y="247" width="242" height="5" rx="2" fill="#125e83" stroke="none"/><text x="305" y="283" font-size="21" fill="#122d40" font-weight="600" text-anchor="start">DTS · Raman</text><text x="305" y="308" font-size="17" fill="#566b79" font-weight="400" text-anchor="start">拉曼散射</text><text x="305" y="340" font-size="16" fill="#125e83" font-weight="500" text-anchor="start">Anti-Stokes / Stokes ratio</text><text x="305" y="364" font-size="15" fill="#125e83" font-weight="400" text-anchor="start">反斯托克斯 / 斯托克斯强度比</text><text x="305" y="397" font-size="18" fill="#122d40" font-weight="600" text-anchor="start">Temperature</text><text x="305" y="420" font-size="17" fill="#122d40" font-weight="400" text-anchor="start">温度</text><rect x="550" y="247" width="242" height="183" rx="8" fill="white" stroke="#d9e2e8"/><rect x="550" y="247" width="242" height="5" rx="2" fill="#125e83" stroke="none"/><text x="566" y="283" font-size="21" fill="#122d40" font-weight="600" text-anchor="start">DSS · Brillouin</text><text x="566" y="308" font-size="17" fill="#566b79" font-weight="400" text-anchor="start">布里渊散射</text><text x="566" y="340" font-size="16" fill="#125e83" font-weight="500" text-anchor="start">Frequency shift</text><text x="566" y="364" font-size="15" fill="#125e83" font-weight="400" text-anchor="start">频移</text><text x="566" y="397" font-size="18" fill="#122d40" font-weight="600" text-anchor="start">Strain + temperature</text><text x="566" y="420" font-size="17" fill="#122d40" font-weight="400" text-anchor="start">应变 + 温度敏感性</text><text x="28" y="455" font-size="16" fill="#566b79" font-weight="400" text-anchor="start">Separate modalities; calibration, compensation and coupling matter.</text><text x="28" y="476" font-size="16" fill="#566b79" font-weight="400" text-anchor="start">不同测量方式需分别配置；标定、交叉敏感补偿与耦合影响解释。</text><text x="28" y="88" font-size="15" fill="#566b79" font-weight="400" text-anchor="start">Common implementations / 常见实现</text></g></svg>