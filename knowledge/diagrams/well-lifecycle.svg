<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 453" role="img" aria-labelledby="title desc">
<title id="title">Fiber sensing questions across the well lifecycle / 全井生命周期中的光纤传感问题</title><desc id="desc">A conceptual five-stage well lifecycle: construction and cementing asks where placement and thermal changes occur; completion and stimulation asks where the well responds; production and injection asks how flow-related signals evolve; intervention asks what changed; abandonment asks what monitoring is feasible. The path is illustrative, not a mandatory sequence. Sensing supports evidence; interpreting integrity needs context and independent checks. 五阶段示意路径依次为建井固井、完井增产、生产注入、井筒干预及弃井。各阶段提出对应的观测问题；光纤信号需结合工况、基线和独立检验解释，不能单独证明屏障完整性。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#125e83"/></marker><marker id="warm-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e4ac6c"/></marker></defs>
<rect width="820" height="453" fill="#f8fafc"/>
<g font-family="Inter, Segoe UI, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="28" y="35" font-size="25" fill="#122d40" font-weight="600" text-anchor="start" >Questions across the well lifecycle</text><text x="28" y="64" font-size="20" fill="#125e83" font-weight="400" text-anchor="start" >从建井到弃井：观测问题随阶段变化</text><text x="792" y="32" font-size="13" fill="#566b79" font-weight="600" text-anchor="end" >CONCEPTUAL</text><text x="792" y="54" font-size="16" fill="#566b79" font-weight="400" text-anchor="end" >概念示意</text><line x1="95" y1="113" x2="725" y2="113" stroke="#125e83" stroke-width="3" marker-end="url(#arrow)"/><circle cx="100" cy="113" r="18" fill="#122d40" stroke="none" stroke-width="1"/><text x="100" y="119" font-size="18" fill="white" font-weight="600" text-anchor="middle" >1</text><rect x="28" y="145" width="144" height="235" rx="8" fill="white" stroke="#d9e2e8"/><text x="40" y="176" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >Construction</text><text x="40" y="200" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >+ cementing</text><text x="40" y="227" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >建井</text><text x="40" y="250" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >与固井</text><line x1="40" y1="266" x2="160" y2="266" stroke="#d9e2e8" stroke-width="1" /><text x="40" y="294" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >Placement</text><text x="40" y="317" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >as planned?</text><text x="40" y="343" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >浆体置换</text><text x="40" y="366" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >符合预期？</text><circle cx="255" cy="113" r="18" fill="#122d40" stroke="none" stroke-width="1"/><text x="255" y="119" font-size="18" fill="white" font-weight="600" text-anchor="middle" >2</text><rect x="183" y="145" width="144" height="235" rx="8" fill="white" stroke="#d9e2e8"/><text x="195" y="176" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >Completion</text><text x="195" y="200" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >+ stimulation</text><text x="195" y="227" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >完井</text><text x="195" y="250" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >与增产</text><line x1="195" y1="266" x2="315" y2="266" stroke="#d9e2e8" stroke-width="1" /><text x="195" y="294" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >Where is</text><text x="195" y="317" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >the response?</text><text x="195" y="343" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >哪些井段</text><text x="195" y="366" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >出现响应？</text><circle cx="410" cy="113" r="18" fill="#122d40" stroke="none" stroke-width="1"/><text x="410" y="119" font-size="18" fill="white" font-weight="600" text-anchor="middle" >3</text><rect x="338" y="145" width="144" height="235" rx="8" fill="white" stroke="#d9e2e8"/><text x="350" y="176" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >Production</text><text x="350" y="200" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >+ injection</text><text x="350" y="227" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >生产</text><text x="350" y="250" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >与注入</text><line x1="350" y1="266" x2="470" y2="266" stroke="#d9e2e8" stroke-width="1" /><text x="350" y="294" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >Flow signals</text><text x="350" y="317" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >changing?</text><text x="350" y="343" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >流动相关信号</text><text x="350" y="366" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >如何演化？</text><circle cx="565" cy="113" r="18" fill="#122d40" stroke="none" stroke-width="1"/><text x="565" y="119" font-size="18" fill="white" font-weight="600" text-anchor="middle" >4</text><rect x="493" y="145" width="144" height="235" rx="8" fill="white" stroke="#d9e2e8"/><text x="505" y="176" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >Intervention</text><text x="505" y="227" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >井筒干预</text><line x1="505" y1="266" x2="625" y2="266" stroke="#d9e2e8" stroke-width="1" /><text x="505" y="294" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >What changed</text><text x="505" y="317" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >after work?</text><text x="505" y="343" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >作业前后</text><text x="505" y="366" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >发生什么变化？</text><circle cx="720" cy="113" r="18" fill="#122d40" stroke="none" stroke-width="1"/><text x="720" y="119" font-size="18" fill="white" font-weight="600" text-anchor="middle" >5</text><rect x="648" y="145" width="144" height="235" rx="8" fill="white" stroke="#d9e2e8"/><text x="660" y="176" font-size="17" fill="#122d40" font-weight="600" text-anchor="start" >Abandonment</text><text x="660" y="227" font-size="17" fill="#125e83" font-weight="400" text-anchor="start" >弃井</text><line x1="660" y1="266" x2="780" y2="266" stroke="#d9e2e8" stroke-width="1" /><text x="660" y="294" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >What remains</text><text x="660" y="317" font-size="16" fill="#122d40" font-weight="400" text-anchor="start" >observable?</text><text x="660" y="343" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >哪些变化</text><text x="660" y="366" font-size="16" fill="#566b79" font-weight="400" text-anchor="start" >仍可监测？</text><text x="28" y="414" font-size="17" fill="#566b79" font-weight="400" text-anchor="start" >Signals need operational context, a baseline and independent checks.</text><text x="28" y="442" font-size="17" fill="#566b79" font-weight="400" text-anchor="start" >光纤信号需结合工况、基线与独立检验；不能单独证明屏障完整性。</text></g></svg>
